<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tech Stock Pick</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        .title {
            font-family: Georgia, serif;
            font-size: 32px;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        .heading {
            background-color: #00ad50;
            color: red;
            text-align: left;
        }

        .name-heading {
            color: red;
            text-align: left;
        }

        .images-heading {
            background-color: lightblue;
            text-align: center;
        }

        .symbol {
            width: 11%;
        }

        .name {
            width: 20%;
        }

        .images {
            width: 27%;
        }

        .contact {
            width: 42%;
        }

        .product-image {
            width: 100%;
            max-width: 160px;
            height: 125px;
            object-fit: contain;
        }

        .copyright {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            font-style: italic;
            padding: 15px;
        }

        .divider {
            border: 0;
            border-top: 2px solid #aaa;
            margin: 15px 0;
        }
    </style>
</head>

<body>

<table>

    <tr>
        <th colspan="4" class="title">
            My tech stock pick
            <hr class="divider">
        </th>
    </tr>

    <tr>
        <th class="name-heading name">Name</th>
        <th class="heading symbol">Symbol</th>
        <th class="images-heading images">Images</th>
        <th class="heading contact">Contact</th>
    </tr>

    <tr>
        <td>Microsofti</td>

        <td>MSFT</td>

        <td>
            <img src="laptop.jpeg"
                 alt="Microsoft laptop"
                 class="product-image">
        </td>

        <td>
            <ul>
                <li>
                    <u>Email: microsofti@mc.se</u>
                </li>
                <li>
                    ©2013 <b>Microsoft</b> Corporation
                </li>
            </ul>

            <ol type="i">
                <li>Email: microsofti@mc.se</li>
                <li>©2026 <b>Microsoft</b> Corporation</li>
            </ol>
        </td>
    </tr>

    <tr>
        <td>Cisco Systems</td>

        <td>CSCO</td>

        <td>
            <img src="cisco.jpeg"
                 alt="Cisco network switch"
                 class="product-image">
        </td>

        <td>
            <b>Switch</b>
            <hr>
            <a href="https://www.uk.hardware.info">
                www.uk.hardware.info
            </a>
        </td>
    </tr>

    <tr>
        <td colspan="4" class="copyright">
            ©BIT 202
        </td>
    </tr>

</table>

</body>
</html>
